<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ── Favicons & App Icons ── -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#16a34a" />

    <!-- ── SEO & Social ── -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NairaBulk – Buy &amp; Sell Nationwide in Nigeria</title>
    <meta name="description" content="Nigeria's bulk marketplace. Browse listings, message sellers, and shop securely with nationwide delivery." />

    <!-- Open Graph -->
    <meta property="og:title" content="NairaBulk" />
    <meta property="og:description" content="Buy and sell anything in Nigeria. Nationwide delivery." />
    <meta property="og:image" content="/icon-512.png" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="NairaBulk" />
    <meta name="twitter:description" content="Buy and sell anything in Nigeria. Nationwide delivery." />
    <meta name="twitter:image" content="/icon-512.png" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: 'class' }
    </script>
    <script>
      (function() {
        const theme = localStorage.getItem('kano-theme') || 'system';
        if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-200">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
